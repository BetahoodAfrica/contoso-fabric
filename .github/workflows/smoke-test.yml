name: smoke-test
on: workflow_dispatch
permissions:
  id-token: write
  contents: read
jobs:
  check:
    strategy:
      matrix:
        env: [test, prod]
    runs-on: ubuntu-latest
    environment: ${{ matrix.env }}
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: List Fabric workspaces visible to the service principal
        run: |
          TOKEN=$(az account get-access-token --resource https://api.fabric.microsoft.com --query accessToken -o tsv)
          curl -s -H "Authorization: Bearer $TOKEN" https://api.fabric.microsoft.com/v1/workspaces | jq -r '.value[].displayName'
